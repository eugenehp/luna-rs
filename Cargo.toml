[package]
name = "luna-rs"
version = "0.1.0"
edition = "2021"
description = "LUNA EEG Foundation Model — inference in Rust (Burn and/or RLX)"
keywords      = ["eeg", "foundational", "BCI", "GPU", "CPU"]
categories    = ["science", "mathematics"]
authors       = ["Eugene Hauptmann"]
license       = "Apache-2.0"
homepage      = "https://github.com/eugenehp/luna-rs"
repository    = "https://github.com/eugenehp/luna-rs"
documentation = "https://docs.rs/luna-rs"
readme        = "README.md"

autoexamples = false
autotests    = false

exclude = [
    "data/",
    "figures/",
    "scripts/",
    "tests/vectors/",
    "bench_results/",
    "bench.sh",
    "PLAN.md",
]

[lib]
name = "luna_rs"
path = "src/lib.rs"

[[bin]]
name = "infer"
path = "src/bin/infer.rs"
required-features = ["rlx"]

[[bin]]
name = "download_weights"
path = "src/bin/download_weights.rs"
required-features = ["hf-download"]

[[bin]]
name = "gen_sample_eeg"
path = "src/bin/gen_sample_eeg.rs"

[[bin]]
name = "safetensors_info"
path = "src/bin/safetensors_info.rs"

[[example]]
name = "load_and_inspect"
path = "examples/load_and_inspect.rs"
required-features = ["burn"]

[[example]]
name = "reconstruct"
path = "examples/reconstruct.rs"
required-features = ["burn"]

[[example]]
name = "channel_invariance"
path = "examples/channel_invariance.rs"
required-features = ["burn"]

[[example]]
name = "benchmark"
path = "examples/benchmark.rs"
required-features = ["burn"]

[[example]]
name = "embed"
path = "examples/embed.rs"
required-features = ["burn"]

[[example]]
name = "quantize"
path = "examples/quantize.rs"
required-features = ["burn"]

[[example]]
name = "backend_compare"
path = "examples/backend_compare.rs"
required-features = ["rlx"]

[[test]]
name = "rlx_graph_compile"
path = "tests/rlx_graph_compile.rs"
required-features = ["rlx"]

[[test]]
name = "parity_rlx_vs_python"
path = "tests/parity_rlx_vs_python.rs"
required-features = ["rlx"]

[[test]]
name = "parity_rlx_vs_burn"
path = "tests/parity_rlx_vs_burn.rs"
required-features = ["burn", "rlx", "ndarray", "rlx-cpu"]

[[test]]
name = "rlx_prepare_burn"
path = "tests/rlx_prepare_burn.rs"
required-features = ["burn", "rlx", "ndarray", "rlx-cpu"]

[[test]]
name = "rlx_graph_parity"
path = "tests/rlx_graph_parity.rs"
required-features = ["burn", "rlx", "ndarray", "rlx-cpu"]

[[test]]
name = "python_parity"
path = "tests/python_parity.rs"
required-features = ["burn", "ndarray"]

[[test]]
name = "intermediate_parity"
path = "tests/intermediate_parity.rs"
required-features = ["burn", "ndarray"]

[[test]]
name = "block_parity"
path = "tests/block_parity.rs"
required-features = ["burn", "ndarray"]

[[test]]
name = "decoder_parity"
path = "tests/decoder_parity.rs"
required-features = ["burn", "ndarray"]

[[test]]
name = "f64_parity"
path = "tests/f64_parity.rs"
required-features = ["burn", "ndarray"]

[[test]]
name = "forward_pass"
path = "tests/forward_pass.rs"
required-features = ["burn", "ndarray"]

[features]
# Default: RLX on CPU only — no Burn dependency.
# Burn reference path: `--features burn,ndarray` (plus optional `wgpu`, …).
default = ["rlx", "rlx-cpu"]

# ── Inference engines (enable one or both) ─────────────────────────────────
burn = ["dep:burn"]
rlx  = ["dep:rlx", "dep:libm"]

# ── Burn backends (each requires `burn`; CPU needs `ndarray` too) ──────────
ndarray         = ["burn", "dep:burn-ndarray", "burn/ndarray"]
blas-accelerate = ["burn", "ndarray", "burn-ndarray?/blas-accelerate"]
openblas-system = ["burn", "ndarray", "burn-ndarray?/blas-openblas-system"]
wgpu            = ["burn", "burn/wgpu"]
burn-metal      = ["burn", "wgpu", "burn-wgpu/metal"]
burn-vulkan     = ["burn", "wgpu", "burn-wgpu/vulkan"]
hdf5            = ["burn", "exg/hdf5"]
hf-download     = ["dep:hf-hub"]

# ── RLX backends (forwarded to the rlx crate) ──────────────────────────────
rlx-cpu             = ["rlx", "rlx/cpu"]
rlx-blas-accelerate = ["rlx", "rlx/blas-accelerate"]
rlx-blas-mkl        = ["rlx", "rlx/blas-mkl"]
rlx-blas-openblas   = ["rlx", "rlx/blas-openblas"]
rlx-metal           = ["rlx", "rlx/metal"]
rlx-mlx             = ["rlx", "rlx/mlx"]
rlx-gpu             = ["rlx", "rlx/gpu"]
rlx-cuda            = ["rlx", "rlx/cuda"]
rlx-rocm            = ["rlx", "rlx/rocm"]
rlx-tpu             = ["rlx", "rlx/tpu"]
rlx-apple-silicon   = ["rlx", "rlx/apple-silicon"]
rlx-nvidia          = ["rlx", "rlx/nvidia"]

# Shorthand aliases (RLX)
cpu             = ["rlx-cpu"]
metal           = ["rlx-metal"]
gpu             = ["rlx-gpu"]
cuda            = ["rlx-cuda"]
rocm            = ["rlx-rocm"]
tpu             = ["rlx-tpu"]
apple-silicon   = ["rlx-apple-silicon"]
nvidia          = ["rlx-nvidia"]

[dependencies]
burn = { version = "0.20.1", default-features = false, features = ["std", "simd"], optional = true }
burn-ndarray = { version = "0.20.1", default-features = false, features = ["std", "simd", "multi-threads"], optional = true }
burn-wgpu = { version = "0.20.1", default-features = true, optional = true }

rlx = { version = "0.2", default-features = false, optional = true }
libm = { version = "0.2", optional = true }

ndarray = "0.17"
exg = { version = "0.0.3", default-features = false }
exg-luna = "0.0.3"
rustfft = "6"
safetensors = "0.7"
half = { version = "2", features = ["bytemuck"] }
rayon = "1"
clap = { version = "4", features = ["derive", "env"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1.0.102"
bytemuck = { version = "1", features = ["derive"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"], optional = true }

[dev-dependencies]
serde_json = "1"
plotters = { version = "0.3", default-features = false, features = [
    "bitmap_backend", "bitmap_encoder",
    "ttf",
    "line_series", "area_series", "full_palette",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
